name: Wiz Snap Notes - Production APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-build:
    name: Build Signed Production APK and AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check signing secrets
        shell: bash
        run: |
          set -e
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Decode Android signing keystore
        shell: bash
        run: |
          set -e
          KEYSTORE_PATH="$RUNNER_TEMP/wiz-snap-notes-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify keystore and alias
        shell: bash
        run: |
          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "Signing keystore and alias verified."

      - name: Build signed production APK and AAB
        run: gradle --no-daemon clean :app:assembleRelease :app:bundleRelease

      - name: Verify release files
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          ls -lh "$APK"
          ls -lh "$AAB"

      - name: Name release files
        shell: bash
        run: |
          set -e
          VERSION=$(grep -m1 -oE "versionName = \"[^\"]+\"" app/build.gradle.kts | cut -d\" -f2)
          NAME="Wiz Snap Notes ($VERSION)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$NAME.aab"
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }} APK
          path: dist/${{ env.RELEASE_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }} AAB
          path: dist/${{ env.RELEASE_NAME }}.aab
          if-no-files-found: error
          retention-days: 30
